<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Matching Game</title>
    <style>
      :root {
        --bg: #101828;
        --panel: #111827;
        --panel-alt: #1f2937;
        --text: #f8fafc;
        --muted: #dfe7f3;
        --line: #4b5563;
        --success: #2e9f5f;
        --accent: #2a78c9;
        --warning: #d97706;
        --danger: #c43d4b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e293b, var(--bg) 65%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .game-shell {
        width: min(92vw, 900px);
        background: rgba(15, 23, 42, 0.94);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 20px;
        padding: 1.5rem;
        box-shadow: 0 25px 60px rgba(15, 23, 42, 0.45);
      }

      .top-bar {
        display: flex;
        justify-content: flex-start;
        margin-bottom: 0.75rem;
      }

      .back-button {
        appearance: none;
        border: 2px solid rgba(148, 163, 184, 0.4);
        background: rgba(148, 163, 184, 0.12);
        color: var(--text);
        font-size: 1.05rem;
        font-weight: 700;
        padding: 0.7rem 1rem;
        border-radius: 12px;
        cursor: pointer;
      }

      .back-button:hover,
      .back-button:focus-visible {
        background: rgba(148, 163, 184, 0.22);
      }

      h1 {
        margin: 0 0 0.4rem;
        text-align: center;
        font-size: clamp(2.5rem, 5vw, 3.6rem);
      }

      .intro {
        margin: 0 0 1.1rem;
        text-align: center;
        color: var(--muted);
        font-size: 1.45rem;
        font-weight: 700;
      }

      .score-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 0.8rem;
        font-size: 1.3rem;
        font-weight: 700;
      }

      .progress-wrap {
        margin-bottom: 1rem;
      }

      .progress-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.45rem;
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--muted);
      }

      .progress-timer {
        font-size: 0.9rem;
        font-weight: 700;
        color: rgba(148, 163, 184, 0.95);
        letter-spacing: 0.04em;
      }

      .progress-bar {
        width: 100%;
        height: 18px;
        background: rgba(148, 163, 184, 0.18);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.3);
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #2a78c9, #2e9f5f);
        transition: width 0.2s ease;
      }

      .game-panel {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 1.2rem;
      }

      .image-panel,
      .answer-panel {
        background: rgba(17, 24, 39, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.38);
        border-radius: 16px;
        padding: 1rem;
      }

      .image-frame {
        display: grid;
        place-items: center;
        min-height: 320px;
        border-radius: 14px;
        background: linear-gradient(135deg, rgba(42, 120, 201, 0.12), rgba(46, 159, 95, 0.12));
        border: 2px solid rgba(148, 163, 184, 0.2);
      }

      .image-frame img {
        max-width: 100%;
        max-height: 320px;
        object-fit: contain;
        border-radius: 12px;
      }

      .word-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.6rem;
        margin: 0.8rem 0 1rem;
      }

      .word-option {
        background: rgba(255, 255, 255, 0.06);
        border: 2px solid rgba(148, 163, 184, 0.35);
        border-radius: 12px;
        color: var(--text);
        padding: 0.8rem 0.9rem;
        font-size: 1.2rem;
        font-weight: 700;
        cursor: pointer;
      }

      .word-option.selected {
        background: rgba(42, 120, 201, 0.28);
        border-color: rgba(42, 120, 201, 0.8);
      }

      label {
        display: block;
        margin-bottom: 0.45rem;
        font-size: 1.2rem;
        font-weight: 700;
      }

      #answer-input {
        width: 100%;
        padding: 0.95rem 1rem;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(15, 23, 42, 0.9);
        color: var(--text);
        font-size: 1.25rem;
        margin-bottom: 0.8rem;
      }

      .actions {
        display: flex;
        gap: 0.7rem;
        margin-top: 0.3rem;
      }

      .primary-btn,
      .secondary-btn,
      .pause-btn {
        flex: 1;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 1.2rem;
        font-weight: 700;
        padding: 0.9rem 1rem;
      }

      .primary-btn {
        background: linear-gradient(135deg, #2f9e6e, #1d7a52);
        color: white;
      }

      .secondary-btn {
        background: linear-gradient(135deg, #d97706, #b45309);
        color: white;
      }

      .pause-btn {
        background: linear-gradient(135deg, #475569, #334155);
        color: white;
      }

      #status {
        min-height: 2.2rem;
        margin-top: 0.9rem;
        font-size: 1.5rem;
        font-weight: 800;
        text-align: center;
      }

      #status.success {
        color: #4ade80;
      }

      #status.error {
        color: #fca5a5;
      }

      #status.celebration-screen {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.2rem;
        padding: 0.9rem 1rem 0.6rem;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(34, 197, 94, 0.15), rgba(59, 130, 246, 0.08));
        box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.18);
        overflow: hidden;
      }

      #status.celebration-screen::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle at 12% 18%, #fbbf24 0 6px, transparent 7px),
          radial-gradient(circle at 28% 32%, #f472b6 0 5px, transparent 6px),
          radial-gradient(circle at 48% 20%, #60a5fa 0 6px, transparent 7px),
          radial-gradient(circle at 67% 35%, #34d399 0 6px, transparent 7px),
          radial-gradient(circle at 80% 22%, #f97316 0 5px, transparent 6px),
          radial-gradient(circle at 22% 62%, #facc15 0 5px, transparent 6px),
          radial-gradient(circle at 58% 68%, #fb7185 0 5px, transparent 6px),
          radial-gradient(circle at 76% 72%, #a78bfa 0 5px, transparent 6px),
          radial-gradient(circle at 90% 52%, #22d3ee 0 5px, transparent 6px);
        opacity: 0.9;
        pointer-events: none;
      }

      .success-icon {
        position: relative;
        z-index: 1;
        display: inline-block;
        font-size: 4rem;
        line-height: 1;
        color: #bbf7d0;
        text-shadow: 0 0 18px rgba(134, 239, 172, 0.7);
        animation: pop-in 0.5s ease-out;
      }

      .status-text {
        position: relative;
        z-index: 1;
        line-height: 1.2;
      }

      @keyframes pop-in {
        0% {
          transform: scale(0.5) rotate(-12deg);
          opacity: 0;
        }
        70% {
          transform: scale(1.12) rotate(4deg);
          opacity: 1;
        }
        100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
      }

      @media (max-width: 700px) {
        .game-panel {
          grid-template-columns: 1fr;
        }

        .word-options {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <div class="top-bar">
        <button class="back-button" type="button" onclick="window.location.href='index.html'" aria-label="Go back to the game chooser">← Back</button>
      </div>
      <h1>Word Match</h1>
      <p class="intro">Look at the picture. Read the word. Type the matching word.</p>

      <div class="score-bar">
        <div>Score: <span id="score">0</span></div>
        <div>Round: <span id="round">1</span></div>
      </div>

      <div class="progress-wrap">
        <div class="progress-meta">
          <span>Words done</span>
          <div>
            <span id="progress-text">0 / 0</span>
            <span class="progress-timer" id="timer-readout">00:00</span>
          </div>
        </div>
        <div class="progress-bar" aria-label="Word progress">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <div class="game-panel">
        <div class="image-panel">
          <div class="image-frame">
            <img id="word-image" src="images/badge.jpeg" alt="Word matching picture" />
          </div>
        </div>

        <div class="answer-panel">
          <div id="word-options" class="word-options" aria-label="Word options"></div>

          <label for="answer-input">Type the word</label>
          <input id="answer-input" type="text" autocomplete="off" placeholder="Type the word here" />

          <div class="actions">
            <button id="check-btn" class="primary-btn" type="button">Check</button>
            <button id="pause-btn" class="pause-btn" type="button" aria-label="Pause game">⏸ Pause</button>
            <button id="next-btn" class="secondary-btn" type="button" style="display: none;">Play again</button>
          </div>

          <p id="status" aria-live="polite"></p>
        </div>
      </div>
    </main>

    <script>
      const words = [
        { word: 'badge', image: 'images/badge.jpeg' },
        { word: 'because', image: 'images/because.jpeg' },
        { word: 'bridge', image: 'images/bridge.jpeg' },
        { word: 'dodge', image: 'images/dodge.jpeg' },
        { word: 'door', image: 'images/door.jpeg' },
        { word: 'edge', image: 'images/edge.jpeg' },
        { word: 'floor', image: 'images/floor.jpeg' },
        { word: 'fudge', image: 'images/fudge.jpeg' },
        { word: 'poor', image: 'images/poor.jpeg' }
      ];

      const statusEl = document.getElementById('status');
      const scoreEl = document.getElementById('score');
      const roundEl = document.getElementById('round');
      const progressTextEl = document.getElementById('progress-text');
      const timerReadoutEl = document.getElementById('timer-readout');
      const progressFillEl = document.getElementById('progress-fill');
      const imageEl = document.getElementById('word-image');
      const answerInput = document.getElementById('answer-input');
      const wordOptionsEl = document.getElementById('word-options');
      const checkBtn = document.getElementById('check-btn');
      const pauseBtn = document.getElementById('pause-btn');
      const nextBtn = document.getElementById('next-btn');

      let score = 0;
      let round = 0;
      let currentWord = null;
      let selectedChoice = null;
      let remainingWords = [];
      let gameFinished = false;
      let isPaused = false;
      let timerInterval = null;
      let startTime = 0;
      let elapsedSeconds = 0;

      function shuffle(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function formatTime(totalSeconds) {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      function updateScore() {
        scoreEl.textContent = String(score);
      }

      function updateRound() {
        const total = words.length;
        const completed = total - remainingWords.length;
        roundEl.textContent = String(Math.min(completed + 1, total));
      }

      function updateTimer() {
        elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        timerReadoutEl.textContent = formatTime(elapsedSeconds);
      }

      function startTimer() {
        const now = Date.now();
        startTime = now - (elapsedSeconds * 1000);
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 250);
        updateTimer();
      }

      function stopTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        timerReadoutEl.textContent = formatTime(elapsedSeconds);
      }

      function updateProgress() {
        const total = words.length;
        const remaining = remainingWords.length;
        const done = total - remaining;
        progressTextEl.textContent = `${done} / ${total}`;
        progressFillEl.style.width = `${(done / total) * 100}%`;
      }

      function setStatus(message, type = '') {
        statusEl.textContent = message;
        statusEl.classList.remove('success', 'error');
        if (type) statusEl.classList.add(type);
      }

      function buildWordOptions(correctWord) {
        const otherWords = words.filter((item) => item.word !== correctWord.word);
        const mixed = shuffle([...otherWords]).slice(0, 3);
        const options = shuffle([correctWord, ...mixed]);

        wordOptionsEl.innerHTML = '';
        options.forEach((item) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'word-option';
          button.textContent = item.word;
          button.addEventListener('click', () => {
            selectedChoice = item.word;
            answerInput.value = item.word;
            document.querySelectorAll('.word-option').forEach((option) => {
              option.classList.toggle('selected', option.textContent === item.word);
            });
          });
          wordOptionsEl.appendChild(button);
        });
      }

      function finishGame() {
        gameFinished = true;
        isPaused = false;
        pauseBtn.disabled = true;
        pauseBtn.textContent = '⏸ Pause';
        stopTimer();
        const total = words.length;
        const completed = Math.max(score, total - remainingWords.length);
        const finalScore = Math.min(completed, total);
        const elapsed = formatTime(elapsedSeconds || 0);
        const message = `Great job! You matched ${finalScore} out of ${total} words in ${elapsed}.`;
        wordOptionsEl.innerHTML = '';
        answerInput.value = '';
        answerInput.disabled = true;
        checkBtn.style.display = 'none';
        nextBtn.textContent = 'Play again';
        nextBtn.style.display = 'block';
        statusEl.classList.remove('error');
        statusEl.classList.add('success', 'celebration-screen');
        statusEl.innerHTML = `<span class="success-icon" aria-label="Success">✓</span><span class="status-text">${message}</span>`;
        imageEl.src = 'images/badge.jpeg';
        imageEl.alt = 'Game complete';
        roundEl.textContent = String(total);
      }

      function nextRound() {
        if (gameFinished) return;

        if (remainingWords.length === 0) {
          finishGame();
          return;
        }

        round = Math.min(round + 1, remainingWords.length);
        const nextIndex = Math.floor(Math.random() * remainingWords.length);
        currentWord = remainingWords.splice(nextIndex, 1)[0];

        imageEl.src = currentWord.image;
        imageEl.alt = currentWord.word;
        answerInput.value = '';
        answerInput.disabled = false;
        checkBtn.disabled = false;
        nextBtn.style.display = 'none';
        nextBtn.disabled = true;
        answerInput.focus();
        buildWordOptions(currentWord);
        setStatus('');
        updateRound();
        updateProgress();
      }

      function restartGame() {
        score = 0;
        round = 0;
        gameFinished = false;
        isPaused = false;
        remainingWords = shuffle([...words]);
        statusEl.classList.remove('success', 'error', 'celebration-screen');
        statusEl.textContent = '';
        answerInput.disabled = false;
        checkBtn.style.display = 'block';
        checkBtn.disabled = false;
        pauseBtn.disabled = false;
        pauseBtn.textContent = '⏸ Pause';
        nextBtn.textContent = 'Play again';
        nextBtn.disabled = true;
        nextBtn.style.display = 'none';
        startTimer();
        updateScore();
        updateProgress();
        nextRound();
      }

      function handleCheck() {
        if (!currentWord || gameFinished) return;

        const typed = answerInput.value.trim().toLowerCase();
        if (!typed) {
          setStatus('Type the word first.', 'error');
          return;
        }

        if (typed === currentWord.word) {
          score += 1;
          updateScore();
          checkBtn.disabled = true;
          nextBtn.disabled = true;
          nextBtn.style.display = 'none';
          setStatus('Well done! Correct spelling.', 'success');
          setTimeout(() => {
            nextRound();
          }, 1200);
          return;
        }

        setStatus('Try again — read the word carefully.', 'error');
      }

      function togglePause() {
        if (gameFinished) return;

        isPaused = !isPaused;
        if (isPaused) {
          stopTimer();
          answerInput.disabled = true;
          checkBtn.disabled = true;
          nextBtn.disabled = true;
          pauseBtn.textContent = '▶ Resume';
          setStatus('Paused', '');
          return;
        }

        startTimer();
        answerInput.disabled = false;
        checkBtn.disabled = false;
        nextBtn.disabled = true;
        pauseBtn.textContent = '⏸ Pause';
        setStatus('');
        answerInput.focus();
      }

      checkBtn.addEventListener('click', handleCheck);
      pauseBtn.addEventListener('click', togglePause);
      nextBtn.addEventListener('click', () => {
        if (gameFinished) {
          restartGame();
          return;
        }
      });

      answerInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          handleCheck();
        }
      });

      updateScore();
      restartGame();
    </script>
  </body>
</html>
