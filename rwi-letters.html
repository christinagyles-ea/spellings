<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RWI Letter Match</title>
    <style>
      :root {
        --bg: #101828;
        --panel: #111827;
        --panel-alt: #1f2937;
        --text: #f8fafc;
        --muted: #dfe7f3;
        --accent: #2a78c9;
        --accent-2: #2e9f5f;
        --warning: #d97706;
        --danger: #c43d4b;
      }

      html {
        background-color: #101828;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background-color: #101828;
        background: radial-gradient(circle at top, #1e293b, var(--bg) 65%);
        color: var(--text);
        font-family: "Sassoon Sans", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
      }

      .game-shell {
        width: min(98vw, 1100px);
        background: rgba(15, 23, 42, 0.94);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 20px;
        box-shadow: 0 25px 60px rgba(15, 23, 42, 0.45);
        padding: 1.4rem;
      }

      .top-bar {
        display: flex;
        justify-content: flex-start;
        margin-bottom: 0.75rem;
      }

      .back-button {
        appearance: none;
        border: 2px solid rgba(148, 163, 184, 0.4);
        background: rgba(148, 163, 184, 0.12);
        color: var(--text);
        font-size: 1.05rem;
        font-weight: 700;
        padding: 0.7rem 1rem;
        border-radius: 12px;
        cursor: pointer;
      }

      .back-button:hover,
      .back-button:focus-visible {
        background: rgba(148, 163, 184, 0.22);
      }

      #listen-btn,
      #hint-btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #d97706, #b45309);
        color: white;
        font-family: "Sassoon Sans", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
        font-size: 1.2rem;
        font-weight: 700;
        padding: 0.9rem 1rem;
        cursor: pointer;
      }

      #listen-btn {
        margin-bottom: 0.75rem;
      }

      #hint-btn {
        margin-bottom: 0.85rem;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
      }

      #listen-btn:hover,
      #listen-btn:focus-visible,
      #hint-btn:hover,
      #hint-btn:focus-visible {
        filter: brightness(1.05);
      }

      h1 {
        margin: 0 0 0.75rem;
        text-align: center;
        font-size: clamp(2.4rem, 5vw, 3.5rem);
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 1rem;
        font-weight: 700;
        color: var(--muted);
        font-size: 1.2rem;
      }

      .hud strong {
        color: var(--text);
      }

      .progress-wrap {
        margin-bottom: 1rem;
      }

      .progress-bar {
        width: 100%;
        height: 18px;
        background: rgba(148, 163, 184, 0.18);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.35);
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 0.25s ease;
      }

      .play-area {
        display: grid;
        grid-template-columns: 1fr 1.25fr;
        gap: 1.2rem;
      }

      .panel {
        background: rgba(17, 24, 39, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.38);
        border-radius: 18px;
        padding: 1rem;
      }

      .image-frame {
        display: grid;
        place-items: center;
        min-height: 280px;
        background: linear-gradient(135deg, rgba(42, 120, 201, 0.12), rgba(46, 159, 95, 0.12));
        border-radius: 14px;
        border: 2px solid rgba(148, 163, 184, 0.2);
        overflow: hidden;
      }

      .image-frame img {
        display: block;
        width: 100%;
        max-width: 340px;
        max-height: 280px;
        object-fit: contain;
        border-radius: 12px;
      }

      .word-stage {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .word-flash {
        min-height: 90px;
        display: grid;
        place-items: center;
        white-space: nowrap;
        font-size: clamp(2.2rem, 4vw, 4rem);
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: lowercase;
        opacity: 1;
        transition: opacity 0.9s ease, transform 0.9s ease;
        color: #f8fafc;
      }

      .word-flash.equation {
        white-space: normal;
        text-align: center;
        letter-spacing: 0.06em;
        text-transform: none;
      }

      .word-flash.fade-out {
        opacity: 0;
        transform: scale(0.96);
      }

      .word-slots {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        min-height: 84px;
        flex-wrap: wrap;
      }

      .slot {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        border: 2px dashed rgba(148, 163, 184, 0.5);
        background: rgba(15, 23, 42, 0.7);
        color: var(--text);
        font-family: "Sassoon Sans", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
        font-size: 2rem;
        font-weight: 900;
        text-transform: lowercase;
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }

      .slot.filled {
        border-style: solid;
        border-color: rgba(46, 159, 95, 0.8);
        background: rgba(46, 159, 95, 0.16);
      }

      .slot.wrong {
        border-color: rgba(196, 61, 75, 0.9);
        background: rgba(196, 61, 75, 0.16);
        transform: translateX(2px);
      }

      .letter-bank {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.7rem;
        min-height: 84px;
        padding-top: 0.35rem;
      }

      .letter-tile {
        width: 58px;
        height: 58px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), #1d4f94);
        color: #fff;
        font-family: "Sassoon Sans", "Comic Sans MS", "Trebuchet MS", sans-serif;
        font-size: 2rem;
        font-weight: 900;
        cursor: grab;
        box-shadow: 0 10px 20px rgba(17, 24, 39, 0.25);
        user-select: none;
      }

      .letter-tile:active {
        cursor: grabbing;
      }

      .letter-tile.hidden {
        display: none;
      }

      .status {
        min-height: 1.8rem;
        text-align: center;
        color: var(--muted);
        font-family: "Sassoon Sans", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
        font-size: 1.4rem;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .status.success {
        color: #4ade80;
      }

      .status.error {
        color: #fca5a5;
      }

      .celebration-screen {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 1rem;
        min-height: 420px;
        padding: 2rem 1rem;
      }

      .celebration-screen.visible {
        display: flex;
      }

      .celebration-image {
        width: min(100%, 260px);
        height: auto;
        filter: drop-shadow(0 16px 26px rgba(16, 24, 40, 0.38));
        background: rgba(255, 255, 255, 0.12);
        border-radius: 22px;
      }

      .play-again-btn {
        appearance: none;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        font-size: 1.25rem;
        font-weight: 800;
        padding: 1rem 1.5rem;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(34, 197, 94, 0.28);
      }

      .play-again-btn:hover,
      .play-again-btn:focus-visible {
        filter: brightness(1.05);
      }

      @media (max-width: 720px) {
        .play-area {
          grid-template-columns: 1fr;
        }

        .slot {
          width: 52px;
          height: 52px;
          font-size: 1.7rem;
        }

        .letter-tile {
          width: 48px;
          height: 48px;
          font-size: 1.7rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <div class="top-bar">
        <button class="back-button" type="button" onclick="window.location.href='index.html'" aria-label="Go back to the game chooser">← Back</button>
      </div>

      <h1>RWI Letter Match</h1>

      <div class="hud">
        <div>Score: <strong id="score">0</strong></div>
        <div>Round: <strong id="round">1</strong></div>
        <div>Time: <strong id="timer">00:00</strong></div>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar" aria-label="Game progress">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <div id="game-content">
        <div class="play-area">
          <div class="panel image-frame">
            <img id="word-image" src="images/RWI-spelling/A.jpg" alt="Letter clue" />
          </div>

          <div class="panel word-stage">
            <button id="listen-btn" type="button" class="secondary-btn" aria-label="Listen to the letter sound">🔊 Listen</button>
            <button id="hint-btn" type="button" aria-label="Show a hint">💡 Hint</button>
            <div id="word-flash" class="word-flash" aria-live="polite">a</div>
            <div id="word-slots" class="word-slots" aria-live="polite"></div>
            <div id="letter-bank" class="letter-bank" aria-live="polite"></div>
            <div id="status" class="status" aria-live="polite"></div>
          </div>
        </div>
      </div>

      <div id="celebration-screen" class="celebration-screen" aria-live="polite">
        <img class="celebration-image" src="images/RWI-spelling/celebrate.gif" alt="Celebration" />
        <h2>Well done!</h2>
        <p id="celebration-message">You finished all the challenges.</p>
        <button id="play-again-btn" class="play-again-btn" type="button">Play again</button>
      </div>
    </main>

    <script>
      const challengeRounds = [
        { type: 'letter', letter: 'a', image: 'images/RWI-spelling/A.jpg' },
        { type: 'letter', letter: 'm', image: 'images/RWI-spelling/M.png' },
        { type: 'letter', letter: 's', image: 'images/RWI-spelling/S.png' },
        { type: 'number', prompt: '2 + 1 = ?', answer: '3', choices: ['1', '2', '3', '4'] },
        { type: 'number', prompt: '3 + 2 = ?', answer: '5', choices: ['4', '5', '6', '7'] },
        { type: 'number', prompt: '5 + 2 = ?', answer: '7', choices: ['6', '7', '8', '9'] },
        { type: 'number', prompt: '4 + 1 = ?', answer: '5', choices: ['3', '4', '5', '6'] }
      ];

      const scoreEl = document.getElementById('score');
      const roundEl = document.getElementById('round');
      const timerEl = document.getElementById('timer');
      const progressFill = document.getElementById('progress-fill');
      const wordImage = document.getElementById('word-image');
      const wordFlash = document.getElementById('word-flash');
      const wordSlots = document.getElementById('word-slots');
      const letterBank = document.getElementById('letter-bank');
      const statusEl = document.getElementById('status');
      const listenBtn = document.getElementById('listen-btn');
      const hintBtn = document.getElementById('hint-btn');
      const gameContent = document.getElementById('game-content');
      const celebrationScreen = document.getElementById('celebration-screen');
      const celebrationMessage = document.getElementById('celebration-message');
      const playAgainBtn = document.getElementById('play-again-btn');

      let roundIndex = 0;
      let score = 0;
      let elapsedSeconds = 0;
      let timerId = null;
      let startTimestamp = 0;
      let draggedLetter = null;
      let draggedLetterId = null;
      let hasUserInteracted = false;

      function shuffleArray(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function formatTime(totalSeconds) {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      function setStatus(message, type = '') {
        statusEl.textContent = message;
        statusEl.classList.remove('success', 'error');
        if (type) statusEl.classList.add(type);
      }

      function updateHud() {
        scoreEl.textContent = String(score);
        roundEl.textContent = String(Math.min(roundIndex + 1, challengeRounds.length));
        timerEl.textContent = formatTime(elapsedSeconds);
        const progress = challengeRounds.length ? ((roundIndex + 1) / challengeRounds.length) * 100 : 0;
        progressFill.style.width = `${progress}%`;
      }

      function markUserInteraction() {
        hasUserInteracted = true;
      }

      function speakLetter(letter) {
        if (!letter || !('speechSynthesis' in window) || !hasUserInteracted) return;

        let playbackStarted = false;
        const showBlockedMessage = () => {
          if (!playbackStarted) {
            setStatus('Audio is blocked by the browser or device settings — use the picture clue instead.', 'error');
          }
        };

        const playSpeech = () => {
          try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(letter);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;

            utterance.onstart = () => {
              playbackStarted = true;
              setStatus('');
            };

            utterance.onend = () => {
              setStatus('');
            };

            utterance.onerror = () => {
              showBlockedMessage();
            };

            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find((voice) => /en(-|_)?(gb|us|au|ie)/i.test(voice.lang)) || voices[0];
            if (preferredVoice) {
              utterance.voice = preferredVoice;
            }

            if (window.speechSynthesis.paused) {
              window.speechSynthesis.resume();
            }

            window.speechSynthesis.speak(utterance);
          } catch (error) {
            console.warn('Speech playback failed:', error);
            showBlockedMessage();
          }
        };

        if (window.speechSynthesis.getVoices().length === 0) {
          let fallbackTimer = null;
          const voiceListener = () => {
            window.speechSynthesis.onvoiceschanged = null;
            if (fallbackTimer) clearTimeout(fallbackTimer);
            playSpeech();
          };

          window.speechSynthesis.onvoiceschanged = voiceListener;
          fallbackTimer = setTimeout(() => {
            if (!window.speechSynthesis || !window.speechSynthesis.getVoices || !window.speechSynthesis.getVoices().length) {
              showBlockedMessage();
            } else {
              playSpeech();
            }
          }, 1200);
          return;
        }

        playSpeech();
      }

      function startTimer() {
        if (timerId) clearInterval(timerId);
        startTimestamp = Date.now() - elapsedSeconds * 1000;
        timerId = setInterval(() => {
          elapsedSeconds = Math.floor((Date.now() - startTimestamp) / 1000);
          timerEl.textContent = formatTime(elapsedSeconds);
        }, 250);
      }

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function renderRound() {
        const currentRound = challengeRounds[roundIndex];
        if (!currentRound) {
          endGame();
          return;
        }

        wordSlots.innerHTML = '';
        letterBank.innerHTML = '';
        wordFlash.classList.remove('fade-out', 'equation');
        wordFlash.textContent = '';
        wordImage.style.display = 'block';

        if (currentRound.type === 'letter') {
          wordImage.src = currentRound.image;
          wordImage.alt = `${currentRound.letter} picture`;
          wordFlash.textContent = '';
          wordFlash.style.textTransform = 'lowercase';
          setStatus('Drag the matching letter into the space.', '');

          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.setAttribute('aria-label', 'Letter slot');
          slot.addEventListener('dragover', (event) => event.preventDefault());
          slot.addEventListener('drop', (event) => {
            event.preventDefault();
            if (!draggedLetter || !draggedLetterId) return;

            markUserInteraction();
            const placedLetter = draggedLetter.toLowerCase();
            const correctLetter = currentRound.letter.toLowerCase();

            if (placedLetter === correctLetter) {
              slot.textContent = placedLetter;
              slot.classList.add('filled');
              setStatus('Correct! Great matching.', 'success');
              score += 1;
              updateHud();

              const tile = document.querySelector(`.letter-tile[data-id="${draggedLetterId}"]`);
              if (tile) tile.classList.add('hidden');

              draggedLetter = null;
              draggedLetterId = null;

              setTimeout(() => {
                roundIndex += 1;
                if (roundIndex >= challengeRounds.length) {
                  endGame();
                } else {
                  renderRound();
                }
              }, 800);
            } else {
              slot.classList.add('wrong');
              setTimeout(() => slot.classList.remove('wrong'), 350);
              setStatus('Try again!', 'error');
            }
          });
          wordSlots.appendChild(slot);

          shuffleArray(['a', 'm', 's']).forEach((letter) => {
            const tile = document.createElement('button');
            tile.type = 'button';
            tile.className = 'letter-tile';
            tile.draggable = true;
            tile.textContent = letter;
            tile.dataset.letter = letter;
            tile.dataset.id = `${currentRound.letter}-${Math.random().toString(16).slice(2)}`;

            tile.addEventListener('dragstart', (event) => {
              markUserInteraction();
              draggedLetter = letter;
              draggedLetterId = tile.dataset.id;
              event.dataTransfer.setData('text/plain', letter);
            });

            tile.addEventListener('dragend', () => {
              draggedLetter = null;
              draggedLetterId = null;
            });

            letterBank.appendChild(tile);
          });
        } else {
          wordImage.style.display = 'none';
          wordFlash.textContent = currentRound.prompt;
          wordFlash.classList.add('equation');
          wordFlash.style.textTransform = 'none';
          wordFlash.classList.remove('fade-out');
          setStatus('Drag the correct number into the space.', '');

          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.textContent = '?';
          slot.setAttribute('aria-label', 'Number slot');
          slot.addEventListener('dragover', (event) => event.preventDefault());
          slot.addEventListener('drop', (event) => {
            event.preventDefault();
            if (!draggedLetter || !draggedLetterId) return;

            markUserInteraction();
            const placedValue = String(draggedLetter).trim();
            const correctValue = String(currentRound.answer);

            if (placedValue === correctValue) {
              slot.textContent = placedValue;
              slot.classList.add('filled');
              setStatus('Correct! Great counting.', 'success');
              score += 1;
              updateHud();

              const tile = document.querySelector(`.letter-tile[data-id="${draggedLetterId}"]`);
              if (tile) tile.classList.add('hidden');

              draggedLetter = null;
              draggedLetterId = null;

              setTimeout(() => {
                roundIndex += 1;
                if (roundIndex >= challengeRounds.length) {
                  endGame();
                } else {
                  renderRound();
                }
              }, 800);
            } else {
              slot.classList.add('wrong');
              setTimeout(() => slot.classList.remove('wrong'), 350);
              setStatus('Try again!', 'error');
            }
          });
          wordSlots.appendChild(slot);

          shuffleArray(currentRound.choices).forEach((option) => {
            const tile = document.createElement('button');
            tile.type = 'button';
            tile.className = 'letter-tile';
            tile.draggable = true;
            tile.textContent = option;
            tile.dataset.letter = option;
            tile.dataset.id = `number-${currentRound.prompt}-${Math.random().toString(16).slice(2)}`;

            tile.addEventListener('dragstart', (event) => {
              markUserInteraction();
              draggedLetter = option;
              draggedLetterId = tile.dataset.id;
              event.dataTransfer.setData('text/plain', option);
            });

            tile.addEventListener('dragend', () => {
              draggedLetter = null;
              draggedLetterId = null;
            });

            letterBank.appendChild(tile);
          });
        }

        updateHud();
      }

      function revealHint() {
        const currentRound = challengeRounds[roundIndex];
        if (!currentRound) return;

        markUserInteraction();

        if (currentRound.type === 'letter') {
          const correctTile = [...document.querySelectorAll('.letter-tile')].find((tile) => tile.dataset.letter === currentRound.letter);
          if (correctTile) {
            correctTile.style.outline = '4px solid #fbbf24';
            correctTile.style.outlineOffset = '3px';
            setTimeout(() => {
              correctTile.style.outline = '';
              correctTile.style.outlineOffset = '';
            }, 1100);
          }
          setStatus(`Hint: match the ${currentRound.letter.toLowerCase()} picture.`, '');
        } else {
          const correctTile = [...document.querySelectorAll('.letter-tile')].find((tile) => tile.dataset.letter === currentRound.answer);
          if (correctTile) {
            correctTile.style.outline = '4px solid #fbbf24';
            correctTile.style.outlineOffset = '3px';
            setTimeout(() => {
              correctTile.style.outline = '';
              correctTile.style.outlineOffset = '';
            }, 1100);
          }
          setStatus(`Hint: the answer is ${currentRound.answer}.`, '');
        }
      }

      function endGame() {
        stopTimer();
        gameContent.style.display = 'none';
        celebrationScreen.classList.add('visible');
        celebrationMessage.textContent = `You matched ${score} out of ${challengeRounds.length} challenges in ${formatTime(elapsedSeconds)}. Great work!`;
        wordFlash.textContent = 'Finished!';
        wordFlash.classList.remove('fade-out', 'equation');
        wordFlash.style.textTransform = 'none';
        wordImage.style.display = 'none';
        wordSlots.innerHTML = '';
        letterBank.innerHTML = '';
        setStatus(`You matched ${score} out of ${challengeRounds.length} challenges. Great work!`, 'success');
      }

      listenBtn.addEventListener('click', () => {
        markUserInteraction();
        const currentRound = challengeRounds[roundIndex];
        if (currentRound && currentRound.type === 'letter') {
          speakLetter(currentRound.letter);
        }
      });

      hintBtn.addEventListener('click', revealHint);
      playAgainBtn.addEventListener('click', () => {
        celebrationScreen.classList.remove('visible');
        gameContent.style.display = 'block';
        startGame();
      });

      function startGame() {
        roundIndex = 0;
        score = 0;
        elapsedSeconds = 0;
        setStatus('');
        wordFlash.classList.remove('fade-out', 'equation');
        wordFlash.style.textTransform = 'none';
        wordImage.style.display = 'block';
        updateHud();
        startTimer();
        renderRound();
      }

      startGame();
    </script>
  </body>
</html>
